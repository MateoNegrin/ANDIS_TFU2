user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Patrón: Gateway Offloading - Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Patrón: CQRS - Elegir backend según método HTTP
    map $request_method $backend {
        GET api_queries;
        HEAD api_queries;
        default api_commands;
    }

    # Upstreams para commands y queries
    include /etc/nginx/upstreams/*.conf;

    server {
        listen 80;
        server_name _;
        
        # Patrón: Gateway Offloading - Redirigir HTTP a HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Patrón: Gateway Offloading - TLS termination
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            # Patrón: Gateway Offloading - Rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            # Patrón: CQRS - Enrutar según método
            proxy_pass http://$backend;
            
            # Patrón: Gateway Offloading - Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # Health check indirecto: si algún upstream no responde, Nginx 502
        }

        location /health {
            # No aplicar rate limit a health checks
            proxy_pass http://api_commands;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
