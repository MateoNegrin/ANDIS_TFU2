# Patrón: Gateway Offloading + CQRS - Upstream para comandos
upstream api_commands {
    least_conn;
    server api-a:5000 max_fails=3 fail_timeout=10s;
    server api-b:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Patrón: CQRS - Upstream para consultas (escalable independientemente)
upstream api_queries {
    least_conn;
    server api-query:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
