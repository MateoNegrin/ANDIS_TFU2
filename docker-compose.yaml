version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emergencies
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - emergencias-net
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis para Cache-Aside
  redis:
    image: redis:7-alpine
    networks:
      - emergencias-net
    expose:
      - "6379"
    restart: unless-stopped

  # Nginx como Gateway (load balancer + TLS + rate limiting)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstreams:/etc/nginx/upstreams:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - emergencias-net
    depends_on:
      - api-a
      - api-b
      - api-query
    restart: unless-stopped

  # API instancia 1 (COMMANDS)
  api-a:
    build: .
    environment:
      APP_ROLE: commands
      APP_VERSION: v1
      INSTANCE_NAME: api-a
      CACHE_ENABLED: "true"
      CACHE_TTL_SECONDS: "60"
      CB_FAILURE_THRESHOLD: "3"
      CB_OPEN_SECONDS: "10"
      JWT_SECRET: dev-secret-change-in-production
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=emergencies;Username=postgres;Password=postgres;Timeout=2;"
    networks:
      - emergencias-net
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # API instancia 2 (COMMANDS)
  api-b:
    build: .
    environment:
      APP_ROLE: commands
      APP_VERSION: v1
      INSTANCE_NAME: api-b
      CACHE_ENABLED: "true"
      CACHE_TTL_SECONDS: "60"
      CB_FAILURE_THRESHOLD: "3"
      CB_OPEN_SECONDS: "10"
      JWT_SECRET: dev-secret-change-in-production
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=emergencies;Username=postgres;Password=postgres;Timeout=2;"
    networks:
      - emergencias-net
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # API instancia QUERIES (separada, escalable independientemente)
  api-query:
    build: .
    environment:
      APP_ROLE: queries
      APP_VERSION: v1
      INSTANCE_NAME: api-query
      CACHE_ENABLED: "true"
      CACHE_TTL_SECONDS: "60"
      CB_FAILURE_THRESHOLD: "3"
      CB_OPEN_SECONDS: "10"
      JWT_SECRET: dev-secret-change-in-production
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=emergencies;Username=postgres;Password=postgres;Timeout=2;"
    networks:
      - emergencias-net
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  emergencias-net:
    driver: bridge

volumes:
  postgres_data:

