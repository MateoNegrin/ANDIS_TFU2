services:
  # Base de datos compartida por las 3 réplicas (persistencia ACID)
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=emergencias
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nginx como load balancer (balancear entre múltiples copias)
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - app-network

  # Réplica 1 de la aplicación
  app1:
    build: .
    environment:
      - PORT=3000
      - NODE_ID=node-1
      - JWT_SECRET=your-super-secret-key-change-in-production
      - DB_CONNECTION_STRING=Host=postgres;Port=5432;Database=emergencias;Username=postgres;Password=postgres
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Réplica 2 de la aplicación
  app2:
    build: .
    environment:
      - PORT=3000
      - NODE_ID=node-2
      - JWT_SECRET=your-super-secret-key-change-in-production
      - DB_CONNECTION_STRING=Host=postgres;Port=5432;Database=emergencias;Username=postgres;Password=postgres
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Réplica 3 de la aplicación
  app3:
    build: .
    environment:
      - PORT=3000
      - NODE_ID=node-3
      - JWT_SECRET=your-super-secret-key-change-in-production
      - DB_CONNECTION_STRING=Host=postgres;Port=5432;Database=emergencias;Username=postgres;Password=postgres
    ports:
      - "3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
