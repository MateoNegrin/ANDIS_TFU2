version: '3.8'

services:
  # Nginx como load balancer (balancear entre múltiples copias)
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - app-network

  # Réplica 1 de la aplicación
  app1:
    build: .
    environment:
      - PORT=3000
      - NODE_ID=node-1
      - JWT_SECRET=your-super-secret-key-change-in-production
    ports:
      - "3001:3000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Réplica 2 de la aplicación
  app2:
    build: .
    environment:
      - PORT=3000
      - NODE_ID=node-2
      - JWT_SECRET=your-super-secret-key-change-in-production
    ports:
      - "3002:3000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Réplica 3 de la aplicación
  app3:
    build: .
    environment:
      - PORT=3000
      - NODE_ID=node-3
      - JWT_SECRET=your-super-secret-key-change-in-production
    ports:
      - "3003:3000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  app-network:
    driver: bridge
